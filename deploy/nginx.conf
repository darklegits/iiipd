server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/counterpick;
    index index.html;

    charset utf-8;
    server_tokens off;

    # сжатие статики
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # кэш статики (данные обновляются редко)
    location ~* \.(?:css|js|json|png|jpg|webp|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML не кэшируем, чтобы обновления подхватывались сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
