    # CounterPick: статический сайт по адресу /counterpick/
    # Добавляется в server-блок основного сайта на :80, чтобы не занимать отдельный порт.
    location = /counterpick { return 301 /counterpick/; }
    location ^~ /counterpick/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /counterpick/index.html;
        add_header Cache-Control "no-cache";
    }

